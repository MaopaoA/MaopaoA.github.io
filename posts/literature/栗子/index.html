"><span>阅读字号</span><button data-font="smaller" aria-label="缩小阅读字号">A−</button><button data-font="larger" aria-label="放大阅读字号">A+</button></div></header><div class="prose"><p>下垂的夜晚<br>
最深处，被子里<br>
有寄居蟹</p>
<p>他在和，远方的聊天<br>
聊海水的咸<br>
聊各自海水的咸</p>
<p>白天，有柳絮飘落<br>
毛衣上，就起了绒球<br>
我毛衣上。</p>
<p>有人在喂猫，楼下，此时，我感觉<br>
是你吗?</p>
<p>是你在喂&quot;栗子&quot;吗?</p>
